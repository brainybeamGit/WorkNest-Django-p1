{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card narrow">
    <h1>Join WorkNest 🚀</h1>
    <p class="sub muted" style="text-align:center;">Create your member account in a minute.</p>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter email address" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" maxlength="15" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Enter password again" required>

        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <p class="form-foot">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
